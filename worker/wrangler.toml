name = "armonim-roster"
main = "roster-worker.js"
compatibility_date = "2024-11-01"

# Vowel points (niqqud) for the recorded recap (DESIGN.md §2.71). OFF: VoxCPM2
# cannot read them — a recording made from pointed text came out as a garble of
# Hebrew and something like Arabic. Left in place for a different voice engine;
# turn on only after hearing one. Recordings are filed per setting.
[vars]
VOICE_NIQQUD = "off"

# The KV namespace that holds the roster. Create it once with:
#   npx wrangler kv namespace create ROSTER_KV
# then paste the printed id below (replace the placeholder).
[[kv_namespaces]]
binding = "ROSTER_KV"
id = "8181a03150814ea0be97b2f853166a0d"

# One Durable Object instance per live match-day room (see match-room.js).
# Free plan requires the SQLite-backed storage class below.
[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

# One instance per client IP, counting wrong publish-word guesses
# (see rate-limit.js).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1-match-room"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2-rate-limiter"
new_sqlite_classes = ["RateLimiter"]

# Holds who has opted into match-clock notifications, and the alarm that fires
# them (see clock-notifier.js). One instance for the whole club.
[[durable_objects.bindings]]
name = "CLOCK_NOTIFIER"
class_name = "ClockNotifier"

[[migrations]]
tag = "v3-clock-notifier"
new_sqlite_classes = ["ClockNotifier"]

# One instance per night, running that night's voiced recap on an alarm
# (see recap-voice.js, §2.69). Needs VOICE_URL, MODAL_KEY and MODAL_SECRET
# secrets; without them the routes answer "not-configured" and the app shows
# no button.
[[durable_objects.bindings]]
name = "RECAP_VOICE"
class_name = "RecapVoice"

[[migrations]]
tag = "v4-recap-voice"
new_sqlite_classes = ["RecapVoice"]

# Team of the Month (§2.25). 05:00 UTC on the 1st — 08:00 Israel time in
# summer, 07:00 in winter; crons are UTC only. Registers any finished month
# that has no team yet, so a missed run costs nothing and the first run after
# deploying backfills the whole archive.
[triggers]
crons = ["0 5 1 * *"]
