name = "armonim-roster"
main = "roster-worker.js"
compatibility_date = "2024-11-01"

# The KV namespace that holds the roster. Create it once with:
#   npx wrangler kv namespace create ROSTER_KV
# then paste the printed id below (replace the placeholder).
[[kv_namespaces]]
binding = "ROSTER_KV"
id = "8181a03150814ea0be97b2f853166a0d"

# One Durable Object instance per live match-day room (see match-room.js).
# Free plan requires the SQLite-backed storage class below.
[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1-match-room"
new_sqlite_classes = ["MatchRoom"]
