<!doctype html>

    <meta name="theme-color" content="#f3e5c3" />

         is not cosmetic: Apple only allows web notifications for installed web
         apps, so match-clock alerts (§2.17) depend on it. Paths are relative
         because GitHub Pages serves the site from /armonim-teams/. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Armonim FC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Armonim FC ⚽</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
