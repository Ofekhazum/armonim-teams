name: Deploy voice comparison to Modal

# The one-off likeness comparison (voice/compare_app.py, DESIGN.md §2.69.1).
# Separate from the live voice server, and deployed only from its own branch:
# it never touches the app the 🎙️ button talks to.

on:
  push:
    branches: [feat/voice-likeness]
    paths:
      - 'voice/compare_app.py'
      - 'voice/lab.py'
      - 'voice/speech.py'
      - '.github/workflows/deploy-voice-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-voice-compare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install modal==1.6.2
      - run: modal deploy voice/compare_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
